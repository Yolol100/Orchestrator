name: Legacy Leads SMTP Route (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm legacy domain route is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'LEGACY_DOMAIN_ROUTE=disabled'
          echo 'Leads SMTP execution is owned by Yolol100/Leadscanner. Orchestrator remains generic GitHub transport only.'
