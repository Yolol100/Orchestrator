name: Orchestrator CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-outreach.txt

      - name: Install outreach runtime dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-outreach.txt

      - name: Verify adapter registry fingerprint
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          registry = json.loads(Path('config/adapter-registry.json').read_text(encoding='utf-8'))
          canonical = json.dumps(registry, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          actual = hashlib.sha256(canonical).hexdigest()
          expected = Path('config/adapter-registry.sha256').read_text(encoding='utf-8').strip()
          if actual != expected:
              raise SystemExit(f'adapter registry fingerprint mismatch: expected={expected} actual={actual}')
          print(actual)
          PY

      - name: Validate platform architecture
        run: |
          python3 scripts/validate_platform_architecture.py config/platform-repositories.json
          python3 -m unittest tests/test_platform_architecture.py -v

      - name: Run documented compile and regression checks
        uses: stateful/runme-action@d88fd274f74c3fda03d0bf7089ce93d24c8adbaa # v3
        with:
          version: v3.17.2
          workflows: |
            compile-python
            regression-tests
